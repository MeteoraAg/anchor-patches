name: Dependency audit

# Runs on every PR, whatever the base branch or the files changed: new advisories are published
# against dependencies that are already in the lockfile
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # advisories, licenses, bans and sources, see deny.toml
  cargo_deny:
    name: Cargo Deny
    runs-on: &runner ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
